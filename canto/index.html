<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinador de Canto</title><style>body{font:16px system-ui;background:#0c1425;color:#fff;margin:0;padding:18px;max-width:760px;margin:auto}textarea,input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #52627d}textarea{width:100%;height:190px;box-sizing:border-box;background:#192943;color:white}input{background:#192943;color:white;max-width:100%}button{background:#347ce5;color:white;margin:4px;cursor:pointer}.verse{background:#1c2b44;border-radius:14px;padding:14px;margin:12px 0}.verse input{width:100%;box-sizing:border-box}small{color:#b7c8e1}h1{font-size:1.5rem}</style><h1>🎤 Treinador de Canto</h1><p>Cole a letra abaixo: cada linha vira um verso com áudio em inglês e transcrição editável.</p><input id="song" placeholder="Nome da música" value="For Whom the Bell Tolls — Bee Gees"><p><textarea id="lyrics" placeholder="Cole a letra completa, um verso por linha"></textarea></p><label>Velocidade <select id="speed"><option value=".7">Devagar</option><option value="1" selected>Normal</option><option value="1.15">Rápido</option></select></label><button id="prepare">Preparar versos</button><button id="stop">Parar áudio</button><p id="status"></p><main id="verses"></main><script>
const $=id=>document.getElementById(id),key='treinador-canto-v3';let rows=[];
try{const x=JSON.parse(localStorage.getItem(key)||'{}');$('lyrics').value=x.lyrics||'';$('song').value=x.song||$('song').value;}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({lyrics:$('lyrics').value,song:$('song').value}));}catch(e){}}
function speak(s){if(!('speechSynthesis'in window)){alert('Este navegador não oferece síntese de voz. Abra no Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number($('speed').value);let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}
function render(){save();let lines=$('lyrics').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);$('verses').replaceChildren();$('status').textContent=lines.length+' versos preparados';lines.forEach((s,i)=>{const div=document.createElement('section');div.className='verse';const n=document.createElement('small');n.textContent='Verso '+(i+1);const p=document.createElement('p');p.textContent=s;const input=document.createElement('input');input.placeholder='Transcrição aproximada (edite para estudar)';input.value=rows[i]?.text===s?rows[i].hint:'';input.oninput=()=>{rows[i].hint=input.value};const b=document.createElement('button');b.textContent='🔊 Ouvir';b.onclick=()=>speak(s);const repeat=document.createElement('button');repeat.textContent='🔁 Repetir 3×';repeat.onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();for(let j=0;j<3;j++){let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number($('speed').value);speechSynthesis.speak(u)}};div.append(n,p,input,b,repeat);$('verses').append(div)});rows=lines.map((text,i)=>({text,hint:rows[i]?.text===text?rows[i].hint:''}))}
$('prepare').onclick=render;$('stop').onclick=()=>speechSynthesis.cancel();$('lyrics').addEventListener('input',()=>{clearTimeout(window.refresh);window.refresh=setTimeout(render,300)});$('song').addEventListener('input',save);render();
</script></html>
