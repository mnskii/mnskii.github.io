<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinador de Canto</title><style>body{font:16px system-ui;background:#0c1425;color:#fff;margin:0;padding:18px;max-width:760px;margin:auto}textarea,input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #52627d}textarea{width:100%;height:190px;box-sizing:border-box;background:#192943;color:white}input{background:#192943;color:white;max-width:100%}button{background:#347ce5;color:white;margin:4px;cursor:pointer}.verse{background:#1c2b44;border-radius:14px;padding:14px;margin:12px 0}.verse input{width:100%;box-sizing:border-box}small{color:#b7c8e1}h1{font-size:1.5rem}</style><h1>🎤 Treinador de Canto</h1><p>Cole a letra abaixo: cada linha vira um verso com áudio em inglês e transcrição automática aproximada e editável.</p><input id="song" placeholder="Nome da música" value="For Whom the Bell Tolls — Bee Gees"><p><textarea id="lyrics" placeholder="Cole a letra completa, um verso por linha"></textarea></p><label>Velocidade <select id="speed"><option value=".7">Devagar</option><option value="1" selected>Normal</option><option value="1.15">Rápido</option></select></label><button id="prepare">Preparar versos</button><button id="stop">Parar áudio</button><p id="status"></p><main id="verses"></main><script>
const $=id=>document.getElementById(id),key='treinador-canto-v3';let rows=[];
try{const x=JSON.parse(localStorage.getItem(key)||'{}');$('lyrics').value=x.lyrics||'';$('song').value=x.song||$('song').value;}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({lyrics:$('lyrics').value,song:$('song').value}));}catch(e){}}
function speak(s){if(!('speechSynthesis'in window)){alert('Este navegador não oferece síntese de voz. Abra no Safari.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number($('speed').value);let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}

const dictionary={i:'ái',you:'iú',your:'iór',"you're":'iór',me:'mí',my:'mái',we:'uí',our:'áuer',they:'dêi',them:'dém',he:'rí',she:'shí',it:'ít',is:'íz',are:'ár',was:'uóz',were:'uêr',be:'bí',been:'bín',am:'ém',a:'â',an:'ân',the:'dâ',and:'énd',or:'ór',but:'bât',of:'âv',to:'tú',for:'fór',from:'frâm',in:'ín',on:'ón',at:'ét',with:'uíd',without:'uidáut',this:'dís',that:'dét',these:'díz',those:'dôuz',there:'dér',here:'rír',where:'uér',when:'uén',why:'uái',what:'uót',who:'rú',whom:'rúm',how:'ráu',all:'ól',no:'nôu',not:'nót',yes:'iés',do:'dú',does:'dâz',did:'díd',dont:'dôunt',"don't":'dôunt',"didn't":'dídânt',"can't":'ként',cannot:'kénót',could:'kúd',would:'uúd',should:'shúd',will:'uíl',"won't":'uôunt',can:'kén',have:'rév',has:'réz',had:'réd',if:'íf',then:'dén',than:'dén',so:'sôu',as:'éz',just:'djâst',like:'láik',love:'lâv',life:'láif',live:'lív',heart:'rárt',world:'uêrld',time:'táim',day:'dêi',night:'náit',light:'láit',right:'ráit',wrong:'rông',long:'lóng',strong:'stróng',song:'sóng',sing:'síng',say:'sêi',said:'séd',tell:'tél',told:'tôuld',know:'nôu',knew:'niú',think:'thínk',thought:'thót',see:'sí',saw:'só',look:'lúk',looking:'lúking',go:'gôu',going:'gôuing',gone:'gón',come:'kâm',coming:'kâming',back:'bék',away:'âuêi',again:'âguén',never:'néver',ever:'éver',always:'óluêiz',forever:'foréver',still:'stíl',more:'mór',one:'uân',two:'tú',three:'thrí',first:'fârst',last:'lést',only:'ôunli',every:'évri',everything:'évriting',nothing:'nâthing',something:'sâmthing',someone:'sâmuân',anyone:'éniuân',another:'ânâder',other:'âder',some:'sâm',any:'éni',many:'méni',much:'mâtch',too:'tú',very:'véri',really:'ríali',now:'náu',today:'tudêi',tomorrow:'tumórou',yesterday:'iésterdei',before:'bifór',after:'éfter',until:'ântíl',while:'uáil',because:'bicóz',maybe:'mêibi',baby:'bêibi',girl:'gârl',boy:'bói',man:'mén',woman:'uúman',people:'pípol',home:'rôum',house:'ráus',door:'dór',eyes:'áiz',eye:'ái',face:'fêis',hand:'rénd',hands:'réndz',hold:'rôuld',touch:'tâtch',kiss:'kís',cry:'krái',tears:'tírz',smile:'smáil',feel:'fíl',feeling:'fíling',need:'níd',want:'uónt',give:'guív',take:'têik',make:'mêik',made:'mêid',let:'lét',keep:'kíp',leave:'lív',left:'léft',stay:'stêi',wait:'uêit',believe:'bilív',hope:'rôup',dream:'drím',fall:'fól',falling:'fóling',down:'dáun',up:'âp',out:'áut',over:'ôuver',under:'ânder',through:'thrú',together:'tuguéder',apart:'âpárt',alone:'âlôun',lost:'lóst',found:'fáund',break:'brêik',broken:'brôuken',bell:'bél',bells:'bélz',tolls:'tôulz',toll:'tôul',whenever:'uenéver',wherever:'ueréver',fire:'fáier',rain:'rêin',sun:'sân',moon:'mún',stars:'stárz',sky:'skái',sea:'sí',ocean:'ôushan',blue:'blú',black:'blék',white:'uáit',good:'gúd',bad:'béd',better:'béter',best:'bést',hard:'rárd',easy:'ízi',enough:'inâf',please:'plíz',thank:'thénk',sorry:'sóri',hello:'relôu',goodbye:'gudbái',oh:'ôu',yeah:'ié',hey:'rêi',ooh:'ú',ah:'á',im:'áim',"i'm":'áim',ive:'áiv',"i've":'áiv',ill:'áil',"i'll":'áil',youre:'iór',youve:'iúv',"you've":'iúv',thats:'déts',"that's":'déts',its:'íts',"it's":'íts',theres:'dérz',"there's":'dérz'};
function approximateWord(word){const lower=word.toLowerCase();if(dictionary[lower])return dictionary[lower];let s=lower.replace(/tion\b/g,'shân').replace(/sion\b/g,'jân').replace(/ture\b/g,'tchâr').replace(/igh/g,'ái').replace(/ough/g,'ôu').replace(/eigh/g,'êi').replace(/ph/g,'f').replace(/sh/g,'sh').replace(/ch/g,'tch').replace(/th/g,'th').replace(/ck/g,'k').replace(/qu/g,'ku').replace(/ee/g,'í').replace(/oo/g,'ú').replace(/ea/g,'í').replace(/ai/g,'êi').replace(/ay/g,'êi').replace(/ow\b/g,'ôu').replace(/ou/g,'áu').replace(/ing\b/g,'ing').replace(/er\b/g,'âr').replace(/ed\b/g,'d').replace(/y\b/g,'i').replace(/e\b/g,'').replace(/w/g,'u').replace(/j/g,'dj');return s}
function approximate(line){return line.replace(/[A-Za-z]+(?:['’][A-Za-z]+)*/g,approximateWord)}

function render(){save();let lines=$('lyrics').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);$('verses').replaceChildren();$('status').textContent=lines.length+' versos preparados';lines.forEach((s,i)=>{const div=document.createElement('section');div.className='verse';const n=document.createElement('small');n.textContent='Verso '+(i+1);const p=document.createElement('p');p.textContent=s;const input=document.createElement('input');input.placeholder='Pronúncia aproximada em português (editável)';input.value=rows[i]?.text===s?rows[i].hint:approximate(s);input.oninput=()=>{rows[i].hint=input.value};const b=document.createElement('button');b.textContent='🔊 Ouvir';b.onclick=()=>speak(s);const repeat=document.createElement('button');repeat.textContent='🔁 Repetir 3×';repeat.onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();for(let j=0;j<3;j++){let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number($('speed').value);speechSynthesis.speak(u)}};div.append(n,p,input,b,repeat);$('verses').append(div)});rows=lines.map((text,i)=>({text,hint:rows[i]?.text===text?rows[i].hint:approximate(text)}))}
$('prepare').onclick=render;$('stop').onclick=()=>speechSynthesis.cancel();$('lyrics').addEventListener('input',()=>{clearTimeout(window.refresh);window.refresh=setTimeout(render,300)});$('song').addEventListener('input',save);render();
</script></html>
